PLG_TASK_MCPASK="Task - AI Ask"
PLG_TASK_MCPASK_XML_DESCRIPTION="Offers the scheduled task that synchronises the index of AI Ask."
PLG_TASK_MCPASK_SYNC_TITLE="AI Ask - Synchronise the index"
PLG_TASK_MCPASK_SYNC_DESC="Indexes content that became public or could not be indexed when it was saved, checks the rest for changes, and removes what is no longer public. Every 15 minutes to once an hour is a sensible interval."
PLG_TASK_MCPASK_FORGET_TITLE="AI Ask - Forget old records"
PLG_TASK_MCPASK_FORGET_DESC="Forgets what AI Ask keeps of its visitors as its options say: the words of questions and the accounts that asked, then their figures, attacks kept as evidence, handoffs, agent counts, agent conversations and reports past their time. Once a day."
