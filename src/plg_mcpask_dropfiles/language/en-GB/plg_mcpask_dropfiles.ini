PLG_MCPASK_DROPFILES="AI Ask - Dropfiles documents"
PLG_MCPASK_DROPFILES_XML_DESCRIPTION="Adds the public files of Dropfiles (PDF, Word, PowerPoint, Excel, Markdown) to what AI Ask answers from: indexed and searched together with the site's pages, and cited as files to open or download."
PLG_MCPASK_DROPFILES_NOTE="Only files a visitor who is not signed in may download are read: published, in published categories with Public access, within their publishing dates and kept on this server. Their text goes into the same index as the site's pages, so every answer can draw on both. After changing these settings, run <strong>Index the site</strong> on the AI Ask dashboard. Scanned PDFs without a text layer have no text to read."
PLG_MCPASK_DROPFILES_CATEGORIES="Categories"
PLG_MCPASK_DROPFILES_CATEGORIES_DESC="The Dropfiles categories whose files are answered from, with the categories under them. None chosen: all public categories."
PLG_MCPASK_DROPFILES_EXTENSIONS="Kinds of files"
PLG_MCPASK_DROPFILES_EXTENSIONS_DESC="The kinds of files read. Older formats (.doc, .ppt, .xls) cannot be read; save them in the newer format."
PLG_MCPASK_DROPFILES_MAX_SIZE="Largest file (MB)"
PLG_MCPASK_DROPFILES_MAX_SIZE_DESC="Larger files are passed over: reading a very large PDF takes long and much memory."
