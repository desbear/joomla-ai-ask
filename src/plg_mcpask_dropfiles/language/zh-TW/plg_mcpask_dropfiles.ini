PLG_MCPASK_DROPFILES="AI 問答 - Dropfiles 文件"
PLG_MCPASK_DROPFILES_XML_DESCRIPTION="把 Dropfiles 的公開檔案（PDF、Word、PowerPoint、Excel、Markdown）加入 AI 問答的資料來源：與網站頁面一起索引、一起搜尋，回答時以可開啟或下載的檔案引用。"
PLG_MCPASK_DROPFILES_NOTE="只讀取未登入訪客可以下載的檔案：已發佈、所在分類已發佈且存取權限為「公開」、在發佈期間內、存放在本主機上。檔案文字與網站頁面放在同一個索引，每次回答都會一起搜尋。變更設定後，請到 AI 問答儀表板執行<strong>索引網站</strong>。沒有文字層的掃描 PDF 無法讀到文字。"
PLG_MCPASK_DROPFILES_CATEGORIES="分類"
PLG_MCPASK_DROPFILES_CATEGORIES_DESC="要納入回答的 Dropfiles 分類，包含其下的子分類。未選擇：全部公開分類。"
PLG_MCPASK_DROPFILES_EXTENSIONS="檔案類型"
PLG_MCPASK_DROPFILES_EXTENSIONS_DESC="要讀取的檔案類型。舊格式（.doc、.ppt、.xls）無法讀取，請另存為新格式。"
PLG_MCPASK_DROPFILES_MAX_SIZE="檔案大小上限（MB）"
PLG_MCPASK_DROPFILES_MAX_SIZE_DESC="超過的檔案會略過：讀取很大的 PDF 需要很久的時間與大量記憶體。"
