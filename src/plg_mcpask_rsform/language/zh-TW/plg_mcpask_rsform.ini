PLG_MCPASK_RSFORM="AI 問答 - RSForm 表單 Agent"
PLG_MCPASK_RSFORM_XML_DESCRIPTION="讓AI 問答以對話方式填寫 RSForm! Pro 表單：一次一頁、AI 協助填入、推薦回答、確認後送出。"
PLG_MCPASK_RSFORM_TYPE="RSForm 表單"
PLG_MCPASK_RSFORM_TYPE_DESC="以對話方式填寫一張 RSForm! Pro 表單，確認後依 RSForm 原本的流程送出（通知信、送出紀錄照常）。"
PLG_MCPASK_RSFORM_FIELD_FORM="表單"
PLG_MCPASK_RSFORM_FIELD_FORM_DESC="要在對話中填寫的 RSForm! Pro 表單。分頁的表單會一次給一頁；驗證碼不會出現，改由問答的防濫用機制把關。"
PLG_MCPASK_RSFORM_FIELD_EXTRACT="AI 協助填寫"
PLG_MCPASK_RSFORM_FIELD_EXTRACT_DESC="訪客用自己的話回答時，由 AI 把內容填入對應欄位。關閉時只能在欄位卡片中填寫。"
PLG_MCPASK_RSFORM_FIELD_ADVANCE="填完自動下一頁"
PLG_MCPASK_RSFORM_FIELD_ADVANCE_DESC="一頁的欄位都由回答填好時，直接進入下一頁。"
PLG_MCPASK_RSFORM_FIELD_SUGGEST="推薦回答"
PLG_MCPASK_RSFORM_FIELD_SUGGEST_DESC="每一頁依欄位設計產生兩三句推薦回答，訪客可以修改後送出。"
PLG_MCPASK_RSFORM_OPENING="我們來一起填寫「%1$s」，共 %2$d 頁。你可以直接在下面的欄位填寫，或用自己的話告訴我，我幫你填進去。"
PLG_MCPASK_RSFORM_PAGE="第 %1$d 頁，共 %2$d 頁"
PLG_MCPASK_RSFORM_NEXT="下一頁"
PLG_MCPASK_RSFORM_REVIEW="檢查並送出"
PLG_MCPASK_RSFORM_FIX="有幾個欄位還需要修正，請看標示的地方。"
PLG_MCPASK_RSFORM_SUMMARY="請確認以下內容，確認後才會送出"
PLG_MCPASK_RSFORM_CONFIRM="確認送出"
PLG_MCPASK_RSFORM_EDIT="修改"
PLG_MCPASK_RSFORM_EDIT_PAGE="修改第 %d 頁"
PLG_MCPASK_RSFORM_THANKS="已經收到，謝謝你！"
PLG_MCPASK_RSFORM_NOT_UNDERSTOOD="我沒有完全理解，可以直接在欄位裡填寫，或換個說法告訴我。"
PLG_MCPASK_RSFORM_REPORT_WRITING="正在為你撰寫分析報告…"
PLG_MCPASK_RSFORM_FIELD_SKIP="不顯示的欄位"
PLG_MCPASK_RSFORM_FIELD_SKIP_DESC="對話中不出現的欄位名稱，以逗號分隔，例如表單頁面本來就隱藏的文字。若是需要填寫的欄位，送出時會是空白。"
PLG_MCPASK_RSFORM_FIELD_PAGE_FIELD="記錄來源頁面的欄位"
PLG_MCPASK_RSFORM_FIELD_PAGE_FIELD_DESC="一個欄位名稱（通常是隱藏欄位），送出時填入訪客開始對話時所在頁面的網址。"
PLG_MCPASK_RSFORM_FIELD_LOOKUPS="查詢建議"
PLG_MCPASK_RSFORM_FIELD_LOOKUPS_DESC="訪客輸入時，向外部服務查詢並列出建議的欄位，就像表單自己的程式常做的：輸入公司名稱找出公司，並帶入統一編號。查詢由訪客的瀏覽器發出，所以該服務必須允許本網站（CORS）。"
PLG_MCPASK_RSFORM_LOOKUP_FIELD="欄位"
PLG_MCPASK_RSFORM_LOOKUP_URL="服務網址"
PLG_MCPASK_RSFORM_LOOKUP_URL_DESC="{query} 會換成訪客輸入的文字。服務需回傳 JSON 物件陣列。"
PLG_MCPASK_RSFORM_LOOKUP_VALUE="填入欄位的鍵"
PLG_MCPASK_RSFORM_LOOKUP_VALUE_DESC="每個物件中，要填進這個欄位的值的鍵名。"
PLG_MCPASK_RSFORM_LOOKUP_NOTE="旁註的鍵"
PLG_MCPASK_RSFORM_LOOKUP_NOTE_DESC="選填：在每個建議旁以小字顯示的鍵，用來區分名稱相近的項目。"
PLG_MCPASK_RSFORM_LOOKUP_FILL="一併帶入的欄位"
PLG_MCPASK_RSFORM_LOOKUP_FILL_DESC="每行一個「欄位=鍵」：選了建議後，同一頁的這些欄位會填入該建議的對應值。"
