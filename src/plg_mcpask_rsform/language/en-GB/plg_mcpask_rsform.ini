PLG_MCPASK_RSFORM="AI Ask - RSForm agent"
PLG_MCPASK_RSFORM_XML_DESCRIPTION="Lets AI Ask fill in RSForm! Pro forms in conversation: a page at a time, with help from AI, suggested replies, and sent only once confirmed."
PLG_MCPASK_RSFORM_TYPE="RSForm form"
PLG_MCPASK_RSFORM_TYPE_DESC="Fills in an RSForm! Pro form in conversation and, once confirmed, sends it the way RSForm does (its e-mails and submissions as usual)."
PLG_MCPASK_RSFORM_FIELD_FORM="Form"
PLG_MCPASK_RSFORM_FIELD_FORM_DESC="The RSForm! Pro form to fill in. A form with pages is given a page at a time; its captcha is left out, as AI Ask has its own protection against abuse."
PLG_MCPASK_RSFORM_FIELD_EXTRACT="AI fills in"
PLG_MCPASK_RSFORM_FIELD_EXTRACT_DESC="When visitors answer in their own words, the AI service puts what they said into the fields. Off: the fields are filled in on the card only."
PLG_MCPASK_RSFORM_FIELD_ADVANCE="Next page when complete"
PLG_MCPASK_RSFORM_FIELD_ADVANCE_DESC="When an answer fills in every field of a page, go on to the next."
PLG_MCPASK_RSFORM_FIELD_SUGGEST="Suggested replies"
PLG_MCPASK_RSFORM_FIELD_SUGGEST_DESC="Two or three replies for each page, made from its fields; visitors may change them before sending."
PLG_MCPASK_RSFORM_OPENING="Let's fill in \"%1$s\" together, %2$d page(s). Fill in the fields below, or tell me in your own words and I'll put it in."
PLG_MCPASK_RSFORM_PAGE="Page %1$d of %2$d"
PLG_MCPASK_RSFORM_NEXT="Next page"
PLG_MCPASK_RSFORM_REVIEW="Review and send"
PLG_MCPASK_RSFORM_FIX="A few fields need a look: see the marked ones."
PLG_MCPASK_RSFORM_SUMMARY="Please check this; nothing is sent until you confirm"
PLG_MCPASK_RSFORM_CONFIRM="Confirm and send"
PLG_MCPASK_RSFORM_EDIT="Change"
PLG_MCPASK_RSFORM_EDIT_PAGE="Change page %d"
PLG_MCPASK_RSFORM_THANKS="Received, thank you!"
PLG_MCPASK_RSFORM_NOT_UNDERSTOOD="I didn't quite get that. Fill in the fields directly, or tell me another way."
PLG_MCPASK_RSFORM_REPORT_WRITING="Writing your analysis report…"
PLG_MCPASK_RSFORM_FIELD_SKIP="Fields left out"
PLG_MCPASK_RSFORM_FIELD_SKIP_DESC="Names of fields the conversation does not show, separated by commas: text the form's page hides, say. Fields to fill in that are left out are sent empty."
PLG_MCPASK_RSFORM_FIELD_PAGE_FIELD="Field for the page"
PLG_MCPASK_RSFORM_FIELD_PAGE_FIELD_DESC="Name of a field (usually hidden) that is sent with the address of the page the visitor started from."
PLG_MCPASK_RSFORM_FIELD_LOOKUPS="Look-ups"
PLG_MCPASK_RSFORM_FIELD_LOOKUPS_DESC="Fields that suggest values from a service as the visitor types, as a form's own scripts may do: a company name found by its registry, filling in its number. The visitor's browser asks the service, so it must allow this website (CORS)."
PLG_MCPASK_RSFORM_LOOKUP_FIELD="Field"
PLG_MCPASK_RSFORM_LOOKUP_URL="Address of the service"
PLG_MCPASK_RSFORM_LOOKUP_URL_DESC="Where {query} stands, what the visitor typed. The service answers with a JSON list of objects."
PLG_MCPASK_RSFORM_LOOKUP_VALUE="Key of the value"
PLG_MCPASK_RSFORM_LOOKUP_VALUE_DESC="The key in each object whose value goes into the field."
PLG_MCPASK_RSFORM_LOOKUP_NOTE="Key shown beside it"
PLG_MCPASK_RSFORM_LOOKUP_NOTE_DESC="Optional: a key shown smaller beside each suggestion, to tell alike ones apart."
PLG_MCPASK_RSFORM_LOOKUP_FILL="Other fields filled in"
PLG_MCPASK_RSFORM_LOOKUP_FILL_DESC="One per line, field=key: when a suggestion is chosen, these fields of the same page take these values of it."
