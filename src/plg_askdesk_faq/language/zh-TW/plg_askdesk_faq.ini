PLG_ASKDESK_FAQ="AI Ask Desk - 常見問答"
PLG_ASKDESK_FAQ_XML_DESCRIPTION="在客服主控台的 + 選單加上「轉成常見問答」：AI 把對話整理成一則問答（不含客戶的個人資料），工作人員確認後存成網站文章。外掛關閉時，主控台不會出現這個選項。"
PLG_ASKDESK_FAQ_GROUP="選單分組名稱"
PLG_ASKDESK_FAQ_GROUP_DESC="在主控台 + 選單裡，這個選項列在哪個標題底下。留空時使用網站名稱。"
PLG_ASKDESK_FAQ_GROUP_HINT="網站名稱"
PLG_ASKDESK_FAQ_CATEGORY="預設分類"
PLG_ASKDESK_FAQ_CATEGORY_DESC="文章預設存到哪個分類。工作人員在卡片上可以改成自己有權限新增文章的其他分類。"
PLG_ASKDESK_FAQ_CATEGORY_NONE="- 由工作人員選擇 -"
PLG_ASKDESK_FAQ_LANGUAGE="預設語言"
PLG_ASKDESK_FAQ_LANGUAGE_DESC="文章的語言，AI 也用這個語言撰寫。選「全部」時，AI 用工作人員的語言撰寫。"
PLG_ASKDESK_FAQ_TAGS_ALWAYS="一定加上的標籤"
PLG_ASKDESK_FAQ_TAGS_ALWAYS_DESC="每一篇都會預先勾選的標籤，工作人員可以取消。"
PLG_ASKDESK_FAQ_TAGS_SUGGEST="讓 AI 判斷的標籤"
PLG_ASKDESK_FAQ_TAGS_SUGGEST_DESC="例如各產品的標籤。AI 依對話內容從這些標籤裡挑出相關的，預先勾選。卡片上只列出這裡和「一定加上的標籤」；兩個都沒設定時，列出網站所有標籤（最多 200 個）。"
PLG_ASKDESK_FAQ_STATE="存檔後的狀態"
PLG_ASKDESK_FAQ_STATE_DESC="建議維持「未發佈」，在後台檢查、補上圖片後再發佈。只有能變更文章狀態的工作人員，卡片上才能改成「已發佈」。"
PLG_ASKDESK_FAQ_FORM="轉成常見問答"
PLG_ASKDESK_FAQ_FORM_DESC="AI 把這段對話整理成問答，確認後存成文章"
PLG_ASKDESK_FAQ_FORM_MADE="這段對話已轉過 %1$d 篇：%2$s"
PLG_ASKDESK_FAQ_HINT="AI 從對話整理出問題和回答，不放客戶的個人資料。存檔後可以到後台編輯，用 AI 圖片產生封面。"
