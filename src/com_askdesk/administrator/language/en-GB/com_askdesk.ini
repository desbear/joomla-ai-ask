COM_ASKDESK_CONFIG_STAFF_LANGUAGE="Language of the people answering"
COM_ASKDESK_CONFIG_STAFF_LANGUAGE_DESC="The language they read and write: visitors' messages are translated into it. Each can choose their own in the console."
COM_ASKDESK_CONFIG_STAFF_LANGUAGE_SITE="The site's default language"
COM_ASKDESK_CONFIG_TRANSLATE="Translate both ways with AI"
COM_ASKDESK_CONFIG_TRANSLATE_DESC="With the AI service set up in AI Ask: visitors' messages into the language of the people answering, their replies into the visitor's. About one AI request a message; the words first written are kept and both sides can see them."
