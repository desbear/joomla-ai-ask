COM_MCPASK="AI 問答"
COM_MCPASK_XML_DESCRIPTION="透過 OpenAI 依網站自己的內容回答訪客的問題，並標示每段回答來自哪些頁面。前台請搭配「AI 問答」模組使用。"
COM_MCPASK_ACTION_AREA_QUESTIONS="使用：提問紀錄"
COM_MCPASK_ACTION_AREA_QUESTIONS_DESC="可以打開「提問紀錄」。"
COM_MCPASK_ACTION_AREA_PAGES="使用：已索引頁面"
COM_MCPASK_ACTION_AREA_PAGES_DESC="可以打開「已索引頁面」、同步與重新索引；加入、移除頁面與補充文字另需「僅限更改擴充套件選項」。"
COM_MCPASK_ACTION_AREA_QUALITY="使用：回答品質"
COM_MCPASK_ACTION_AREA_QUALITY_DESC="可以打開「回答品質」；編輯、刪除規則另需「編輯項目」「刪除項目」。"
COM_MCPASK_ACTION_AREA_AGENTS="使用：Agents"
COM_MCPASK_ACTION_AREA_AGENTS_DESC="可以打開並設定 Agents。"
COM_MCPASK_ACTION_AREA_HANDOFFS="使用：轉接紀錄"
COM_MCPASK_ACTION_AREA_HANDOFFS_DESC="可以打開並匯出轉接紀錄（含訪客留下的聯絡資料）。"
COM_MCPASK_ACTION_AREA_APPEARANCE="使用：外觀"
COM_MCPASK_ACTION_AREA_APPEARANCE_DESC="可以打開並修改外觀與配色。"
COM_MCPASK_ACTION_AREA_PETS="使用：小寵物"
COM_MCPASK_ACTION_AREA_PETS_DESC="可以打開並編輯小寵物與它們的圖片。"
COM_MCPASK_ACTION_AREA_EMBEDS="使用：嵌入"
COM_MCPASK_ACTION_AREA_EMBEDS_DESC="可以打開並管理嵌入金鑰（含密鑰）。"
COM_MCPASK_ACTION_ASK="提問"
COM_MCPASK_ACTION_ASK_DESC="允許此群組的使用者向網站提問，預設 Public 為允許。若只想讓登入的會員提問：把 Public 改為「未設定」，再把 Registered 設為允許。（將 Guest 群組設為拒絕也可以，但有些網站的訪客群組就是 Public 本身，那樣會擋掉所有人。）"
COM_MCPASK_ACTION_UNLIMITED="不受提問次數限制"
COM_MCPASK_ACTION_UNLIMITED_DESC="此群組的使用者不受每分鐘、每天與全站每日提問次數的限制。超級管理員一律不受限制。"
