MOD_MCP_ASK="AI 問答"
MOD_MCP_ASK_XML_DESCRIPTION="搜尋框形式的問答模組：依網站內容回答訪客的問題，並標示每段回答來自哪些頁面。"
MOD_MCP_ASK_FIELD_PET_LABEL="小寵物"
MOD_MCP_ASK_FIELD_PET_DESC="浮動按鈕換成一隻小寵物（「外觀」選「浮動按鈕」時才有作用）：一樣可以拖曳、點了在牠旁邊打開問答框，並依訪客的操作與回答播放待機、打招呼、思考、回答、開心、困惑、睡覺等動作；對話視窗打開時站在視窗右側。寵物要先在「AI 問答 → 小寵物」建立。"
MOD_MCP_ASK_FIELD_SOURCES_SHOWN_LABEL="資料來源先顯示幾筆"
MOD_MCP_ASK_FIELD_SOURCES_SHOWN_DESC="回答右側的資料來源先列出幾筆，其餘收成「其他 N 筆」，點了才展開。0 為全部列出。"
MOD_MCP_ASK_FIELD_CLEAR_LABEL="清空對話效果"
MOD_MCP_ASK_FIELD_CLEAR_DESC="開始新對話時，舊對話消失的方式。偏好減少動態效果的訪客會直接清空。"
MOD_MCP_ASK_CLEAR_SAUCER="飛碟吸走（或清掃寵物）"
MOD_MCP_ASK_CLEAR_WIND="往左吹走"
MOD_MCP_ASK_CLEAR_HOLE="吸入黑洞"
MOD_MCP_ASK_CLEAR_FADE="直接淡出"
MOD_MCP_ASK_CLEAR_NONE="直接清空（無效果）"
MOD_MCP_ASK_FIELD_CLEANER_LABEL="清掃寵物"
MOD_MCP_ASK_FIELD_CLEANER_DESC="取代飛碟、負責清空對話的寵物，在「AI 問答 → 小寵物 → 清掃寵物」建立。"
MOD_MCP_ASK_CLEANER_SAUCER="內建的飛碟"

; Festive pets (0.19.0)
MOD_MCP_ASK_FESTIVE_TAB="節日小寵物"
MOD_MCP_ASK_FESTIVE_NOTE="特定日子換上另一隻小寵物：聖誕節、農曆新年、週年慶。日期落在某一列的期間內時，用那一列的小寵物（與清掃寵物）取代「模組」分頁的設定；有多列符合時用最上面那一列。日期以全域設定的時區為準。若有整頁快取，頁面會顯示快取當天的小寵物。"
MOD_MCP_ASK_FESTIVE_LABEL="日子與小寵物"
MOD_MCP_ASK_FESTIVE_TITLE="名稱"
MOD_MCP_ASK_FESTIVE_TITLE_HINT="聖誕節"
MOD_MCP_ASK_FESTIVE_FROM="開始"
MOD_MCP_ASK_FESTIVE_TO="結束"
MOD_MCP_ASK_FESTIVE_TO_DESC="最後一天（含）。空白：只有開始那天。"
MOD_MCP_ASK_FESTIVE_YEARLY="每年重複"
MOD_MCP_ASK_FESTIVE_YEARLY_DESC="是：每年同樣的月日（不看年份，期間可以跨年，例如 12-28 到 01-03）。否：只在這幾天。農曆節日每年日期不同，請每年各加一列並關閉每年重複。"
MOD_MCP_ASK_FESTIVE_KEEP="- 沿用「模組」分頁的設定 -"

; Another site's AI Ask (0.20.2)
MOD_MCP_ASK_FIELD_MODE_REMOTE="其他網站的 AI 問答（嵌入）"
MOD_MCP_ASK_REMOTE_NOTE="這個模組改為顯示另一個 Joomla 網站的 AI 問答（回答、Agent、真人客服都在那個網站），而不是本站自己的。請在那個網站的「AI 問答 → 嵌入」建立嵌入金鑰：允許的網站加入本站、開啟「由對方伺服器簽發的憑證」，若會員在那邊還沒有帳號，再開啟「自動建立新會員帳號」。之後本站已登入的會員，會以信箱和姓名被那個網站認得。"
MOD_MCP_ASK_REMOTE_SITE="網站網址"
MOD_MCP_ASK_REMOTE_SITE_DESC="要顯示其 AI 問答的 Joomla 網站網址，需為 https。"
MOD_MCP_ASK_REMOTE_KEY="公開金鑰"
MOD_MCP_ASK_REMOTE_KEY_DESC="嵌入金鑰的公開金鑰（pk_…），在那個網站的「嵌入」頁面可以取得。"
MOD_MCP_ASK_REMOTE_SECRET="密鑰"
MOD_MCP_ASK_REMOTE_SECRET_DESC="嵌入金鑰的密鑰，只存在本站伺服器：用來為每位已登入的訪客簽發一小時有效的憑證，不會寫進網頁。空白：所有訪客在那邊都視為未登入。"
