; Another site's AI Ask (0.20.2)
MOD_MCP_ASK_FIELD_MODE_REMOTE="其他網站的 AI 問答（嵌入）"
MOD_MCP_ASK_REMOTE_NOTE="這個模組改為顯示另一個 Joomla 網站的 AI 問答（回答、Agent、真人客服都在那個網站），而不是本站自己的。請在那個網站的「AI 問答 → 嵌入」建立嵌入金鑰：允許的網站加入本站、開啟「由對方伺服器簽發的憑證」，若會員在那邊還沒有帳號，再開啟「自動建立新會員帳號」。之後本站已登入的會員，會以信箱和姓名被那個網站認得。那個網站自己的訪客也可以透過本站登入（在它的嵌入金鑰開啟「透過這個網站登入」）：網址填 index.php?option=com_mcpask&task=embed.signin&module= 加上本模組的 ID。"
MOD_MCP_ASK_REMOTE_SITE="網站網址"
MOD_MCP_ASK_REMOTE_SITE_DESC="要顯示其 AI 問答的 Joomla 網站網址，需為 https。"
MOD_MCP_ASK_REMOTE_KEY="公開金鑰"
MOD_MCP_ASK_REMOTE_KEY_DESC="嵌入金鑰的公開金鑰（pk_…），在那個網站的「嵌入」頁面可以取得。"
MOD_MCP_ASK_REMOTE_SECRET="密鑰"
MOD_MCP_ASK_REMOTE_SECRET_DESC="嵌入金鑰的密鑰，只存在本站伺服器：用來為每位已登入的訪客簽發一小時有效的憑證，不會寫進網頁。空白：所有訪客在那邊都視為未登入。"
MOD_MCP_ASK_REMOTE_LOGIN="登入網址"
MOD_MCP_ASK_REMOTE_LOGIN_DESC="未登入的訪客按對話視窗的「登入」時要前往的位置：本站自己的登入（例如單一登入），登入後回到原頁面，就會被那個網站認得。{return} 代表原本所在的頁面，{return64} 則是 Joomla 慣用的 base64 格式。空白：本站的登入頁，登入後回到原頁面。會取代那個網站本身的登入按鈕。"
MOD_MCP_ASK_REMOTE_SIZE="小寵物大小（px）"
MOD_MCP_ASK_REMOTE_SIZE_DESC="那個網站的小寵物在本站頁面上的大小，48～240 像素，手機上也一樣；外框會依此預留足夠空間。空白：依小寵物本身設定的大小。訪客可以拖曳按鈕，放下的位置會記在本站。"
MOD_MCP_ASK_REMOTE_LOGOUT="登出網址"
MOD_MCP_ASK_REMOTE_LOGOUT_DESC="已登入的訪客在對話視窗按「登出」時要前往的位置：會一併登出本站（否則下一頁又會自動登入）。{return} 代表原本所在的頁面，{return64} 則是 Joomla 慣用的 base64 格式。空白：本站自己的登出，登出後回到原頁面；有單一登入時，依本站登出的設定處理。"
