MOD_MCP_ASK="AI Ask"
MOD_MCP_ASK_XML_DESCRIPTION="A search box that answers visitors' questions from the site's own content and names the pages each answer came from."
MOD_MCP_ASK_FIELD_PET_LABEL="Pet"
MOD_MCP_ASK_FIELD_PET_DESC="The floating button as a pet (with the \"Floating button\" look only): still dragged and pressed to ask, the box opening beside it, and moving as the visitor asks and is answered; it stands at the right while the conversation is open. Make pets first under AI Ask → Pets."
MOD_MCP_ASK_FIELD_SOURCES_SHOWN_LABEL="Pages shown"
MOD_MCP_ASK_FIELD_SOURCES_SHOWN_DESC="How many pages are listed beside an answer before the rest are folded into "N more". 0 lists them all."
MOD_MCP_ASK_FIELD_CLEAR_LABEL="Clearing the conversation"
MOD_MCP_ASK_FIELD_CLEAR_DESC="How the old conversation goes when a new one is started. Visitors who ask for less motion see it go at once."
MOD_MCP_ASK_CLEAR_SAUCER="Taken away by the saucer (or a cleaning pet)"
MOD_MCP_ASK_CLEAR_WIND="Blown away to the left"
MOD_MCP_ASK_CLEAR_HOLE="Drawn into a black hole"
MOD_MCP_ASK_CLEAR_FADE="Faded out"
MOD_MCP_ASK_CLEAR_NONE="At once, without an effect"
MOD_MCP_ASK_FIELD_CLEANER_LABEL="Cleaning pet"
MOD_MCP_ASK_FIELD_CLEANER_DESC="The pet that takes the conversation away instead of the saucer; made under AI Ask → Pets → Cleaning pets."
MOD_MCP_ASK_CLEANER_SAUCER="The saucer that comes with the extension"

; Festive pets (0.19.0)
MOD_MCP_ASK_FESTIVE_TAB="Festive pets"
MOD_MCP_ASK_FESTIVE_NOTE="Other pets for days of their own: Christmas, Lunar New Year, an anniversary. On the days of a row, its pet (and cleaning pet) take the place of those set in the Module tab; the first row that matches wins. Days are those of the time zone in Global Configuration. Pages kept by a page cache show the pet of the day they were kept."
MOD_MCP_ASK_FESTIVE_LABEL="Days and their pets"
MOD_MCP_ASK_FESTIVE_TITLE="Name"
MOD_MCP_ASK_FESTIVE_TITLE_HINT="Christmas"
MOD_MCP_ASK_FESTIVE_FROM="From"
MOD_MCP_ASK_FESTIVE_TO="To"
MOD_MCP_ASK_FESTIVE_TO_DESC="The last day, included. Empty: the first day only."
MOD_MCP_ASK_FESTIVE_YEARLY="Every year"
MOD_MCP_ASK_FESTIVE_YEARLY_DESC="Yes: the same days every year (the year is not looked at; a period may run over the new year, from 12-28 to 01-03). No: those dates only. Holidays of the lunar calendar fall on other days each year: add them for each year with Every year off."
MOD_MCP_ASK_FESTIVE_KEEP="- As set in the Module tab -"

; Another site's AI Ask (0.20.2)
MOD_MCP_ASK_FIELD_MODE_REMOTE="Another site’s AI Ask (embedded)"
MOD_MCP_ASK_REMOTE_NOTE="This module shows the AI Ask of another Joomla site (its answers, agents and chats with people) instead of this site’s own. On that site, make an embed key under AI Ask → Embeds with this website among its websites, Tokens signed by the other website on, and, for members who have no account there yet, Make accounts for new members on. Signed-in visitors of this site are then known there by their e-mail address and name."
MOD_MCP_ASK_REMOTE_SITE="Site address"
MOD_MCP_ASK_REMOTE_SITE_DESC="The address of the Joomla site whose AI Ask is shown, https."
MOD_MCP_ASK_REMOTE_KEY="Public key"
MOD_MCP_ASK_REMOTE_KEY_DESC="The embed key’s public key (pk_…), from that site’s Embeds page."
MOD_MCP_ASK_REMOTE_SECRET="Secret"
MOD_MCP_ASK_REMOTE_SECRET_DESC="The embed key’s secret. It stays on this server: it signs, for each signed-in visitor, a token valid one hour, and is never written into the page. Empty: every visitor counts as not signed in there."
MOD_MCP_ASK_REMOTE_LOGIN="Sign-in address"
MOD_MCP_ASK_REMOTE_LOGIN_DESC="Where the Sign in button of the conversation takes a visitor who is not signed in: this site’s own sign-in (its single sign-on, say), so they come back signed in and known there. {return} stands for the page they were on, {return64} for it as Joomla takes it (base64). Empty: this site’s login page, back to that page. It takes the place of the other site’s own sign-in button."
MOD_MCP_ASK_REMOTE_SIZE="Pet size (px)"
MOD_MCP_ASK_REMOTE_SIZE_DESC="The size of the other site’s pet on this site’s pages, 48 to 240 pixels, the same on phones; the frame around it is made that big with room to spare. Empty: the sizes set with the pet. Visitors may drag the button; where they leave it is kept for this site."
MOD_MCP_ASK_REMOTE_LOGOUT="Sign-out address"
MOD_MCP_ASK_REMOTE_LOGOUT_DESC="Where Sign out in the conversation takes a signed-in visitor: they are signed out of this site (else the next page would sign them in there again). {return} stands for the page they were on, {return64} for it as Joomla takes it (base64). Empty: this site’s own sign-out, back to that page; with single sign-on, as this site’s sign-out is set up."
